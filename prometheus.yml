# Prometheus config for the image-captioning observability assignment.
global:
  scrape_interval: 5s        # matches the 5 s dashboard refresh required for the demo video
  evaluation_interval: 5s
  external_labels:
    project: captioning-observability

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The Streamlit app runs on the HOST (not in docker); /metrics is on port 8000.
  # host.docker.internal is mapped to the host in docker-compose.yml (extra_hosts).
  - job_name: captioning_app
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: image-captioning

  # node_exporter: system CPU / RAM / disk / network.
  # Default: the node_exporter container in docker-compose.yml.
  # If you installed node_exporter natively instead, use "host.docker.internal:9100".
  - job_name: node
    static_configs:
      - targets: ["node_exporter:9100"]
        labels:
          instance_name: my-machine
